<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Assignment 2 - Konstantin Kirikeza</title>
  </head>
  <body>
    <script type="module" src="script.js"></script>
    <div id="navbar">
      <img id="logo" src="assets/logo.jpeg" alt="Logo" />
      <div id="centreButtons">
        <button id="homeButton">
          Home <img class="icon" src="assets/home.svg" />
        </button>
        <button id="browseButton">
          Browse <img class="icon" src="assets/browse.svg" />
        </button>
        <button id="aboutButton">
          About <img class="icon" src="assets/about.svg" />
        </button>
      </div>
      <button id="cartButton">
        Cart <img class="icon" src="assets/cart.svg" />
      </button>
    </div>
    <div id="views">
      <div id="homeView" class="view">Home View</div>
      <div id="browseView" class="view hidden">
        <div id="browseLayout">
          <aside id="sidePanel">Side Panel</aside>
          <div id="items">
            <div id="title">
              <h2>Browse</h2>
              <div id="itemBoxes"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="singleProductView" class="view hidden">Single Product View</div>
      <div id="shoppingCartView" class="view hidden">Shopping Cart View</div>
      <div id="aboutView" class="view hidden">About View</div>
    </div>
    <footer>
      <h3>
        Source Code:
        <a href="https://github.com/KKirikez/COMP3512-A1" target="_blank"
          >https://github.com/KKirikez/COMP3512-A1</a
        >
      </h3>
    </footer>
  </body>
</html>
